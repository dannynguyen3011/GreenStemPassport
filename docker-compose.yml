# ─── Local Development Stack ────────────────────────────────────────────────
# Chạy:    docker compose up
# Stop:    docker compose down
# Rebuild: docker compose up --build
# Logs:    docker compose logs -f app

services:
  # ─── Next.js app (hot reload) ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: greenstem-app
    ports:
      - "3000:3000"
    volumes:
      # Mount source code để hot reload
      - .:/app
      # Anonymous volumes giữ node_modules và .next của container
      # (tránh OS-specific binary từ host ghi đè)
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      # Override CHROMA_URL trong container để trỏ sang service chromadb
      # (override giá trị Railway URL trong .env.local khi chạy local)
      - CHROMA_URL=http://chromadb:8000
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  # ─── ChromaDB (vector store cho RAG) ──────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: greenstem-chromadb
    ports:
      - "8000:8000"
    volumes:
      # Persist data giữa các lần restart
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
